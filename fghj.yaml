version: "1.0"
service:
  name: "auth-service"
  internal_domain: "auth.fghj.internal"
  build:
    context: "."
    dockerfile: "Dockerfile"
  ports:
    - "8080"
  environment:
    DB_HOST: postgres.fghj.internal
  dependencies:
    - kind: "infra"
      name: "postgres"
      image: "postgres:16"
      environment:
        POSTGRES_PASSWORD: devpassword
        POSTGRES_DB: auth
      ports:
        - "5432"
flows:
  signup-flow:
    description: "New user signup — creates the account and sends a welcome notification. inventory-service and cart-service aren't needed here, so they stay out of this flow's scope even though they're both reachable through checkout-flow."
    dependencies:
      - kind: "service"
        repo: "git@github.com:fghj-fixtures/notification-service.git"
        default_branch: "main"
